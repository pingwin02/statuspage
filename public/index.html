<!doctype html>
<html lang="pl" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Status - Pingwiniasty</title>
    <meta
      name="description"
      content="Sprawdź aktualny status usług oraz obserwuj informacje o ewentualnych awariach."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pingwiniasty.pl/" />
    <meta property="og:title" content="Status - Pingwiniasty" />
    <meta
      property="og:description"
      content="Sprawdź aktualny status usług oraz obserwuj informacje o ewentualnych awariach."
    />
    <meta
      property="og:image"
      content="https://pingwiniasty.pl/assets/other/awatar.jpg"
    />
    <meta property="og:site_name" content="Pingwiniasty" />
    <meta property="og:locale" content="pl_PL" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container py-4" style="max-width: 850px">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" data-i18n="system_status">Status systemu</h1>
        <div>
          <button id="btn-theme" class="btn btn-outline-secondary btn-sm me-2">
            <i class="bi bi-sun"></i>
          </button>
          <button id="btn-lang" class="btn btn-outline-secondary btn-sm me-2">
            EN
          </button>
          <button
            id="btn-refresh"
            class="btn btn-outline-secondary btn-sm"
            data-i18n="refresh"
          >
            Odśwież
          </button>
        </div>
      </div>

      <div id="last-update-container" class="d-flex justify-content-end mb-2">
        <a href="/panel" class="text-muted small text-end" id="last-update"></a>
      </div>

      <div id="overall-status">
        <div class="alert alert-secondary mb-0" data-i18n="loading">
          Ładowanie statusów...
        </div>
      </div>

      <h2 id="services-heading" class="h5 mt-4 d-none" data-i18n="services">
        Usługi
      </h2>
      <ul id="services-list" class="list-group mb-3"></ul>

      <div id="outages-container" class="d-none">
        <h2 class="h5 mt-4" data-i18n="outages_section">Awarie</h2>
        <div id="active-outages" class="mb-3">
          <table id="outages-table" class="table table-sm"></table>
        </div>

        <div id="archive-container" class="d-none pt-3">
          <h3 class="h6 opacity-75" data-i18n="archive">Archiwum</h3>
          <table id="archive-table" class="table table-sm opacity-75"></table>
        </div>
      </div>
    </div>

    <template id="tpl-toast">
      <div class="toast align-items-center border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body"></div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>
    </template>

    <template id="tpl-group-header">
      <li class="list-group-item group-header text-center"></li>
    </template>

    <template id="tpl-service-item">
      <li
        class="list-group-item d-flex justify-content-between align-items-center"
      >
        <span class="service-name"></span>
        <span class="badge"></span>
      </li>
    </template>

    <div
      class="toast-container position-fixed bottom-0 start-0 p-3"
      id="toast-container"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/formatting.js"></script>
    <script src="js/outages.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
