<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel - Statuspage</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav id="navbar" class="navbar bg-body-tertiary border-bottom d-none">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">
          <i class="bi bi-arrow-left me-2"></i>Admin Panel
        </a>
        <div>
          <button id="btn-theme" class="btn btn-outline-secondary btn-sm me-2">
            <i class="bi bi-sun"></i>
          </button>
          <button id="btn-logout" class="btn btn-outline-danger btn-sm">
            Logout <i class="bi bi-box-arrow-right ms-1"></i>
          </button>
        </div>
      </div>
    </nav>

    <div class="container px-2 px-sm-3 py-3 py-sm-4" style="max-width: 1200px">
      <!-- Login Section -->
      <div id="login-section" class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card">
            <div class="card-body">
              <h4 class="card-title text-center mb-4" id="login-title">
                Login
              </h4>
              <div class="input-group mb-3">
                <span class="input-group-text">
                  <i class="bi bi-lock"></i>
                </span>
                <input
                  type="password"
                  id="login-password"
                  class="form-control"
                  placeholder="Admin password"
                />
              </div>
              <div class="d-grid gap-2" id="login-btn-container">
                <button id="btn-login" class="btn btn-primary">
                  Log in <i class="bi bi-arrow-right ms-1"></i>
                </button>
                <a href="/" class="btn btn-outline-secondary">
                  <i class="bi bi-arrow-left me-1"></i>Back to dashboard
                </a>
              </div>
              <div class="d-grid gap-2 d-none" id="setup-btn-container">
                <button id="btn-setup" class="btn btn-success">
                  Set password <i class="bi bi-check-lg ms-1"></i>
                </button>
                <a href="/" class="btn btn-outline-secondary">
                  <i class="bi bi-arrow-left me-1"></i>Back to dashboard
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Admin Panel -->
      <div id="admin-panel" class="d-none">
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title">Edit checks</h5>
            <div id="edit-checks-list"></div>
            <button id="btn-add-group" class="btn btn-success btn-sm mt-2">
              <i class="bi bi-plus-lg me-1"></i>Add group
            </button>
          </div>
        </div>

        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title">Edit outages</h5>
            <div id="edit-outages-list"></div>
            <button id="btn-add-outage" class="btn btn-success btn-sm mt-2">
              <i class="bi bi-plus-lg me-1"></i>Add outage
            </button>
          </div>
        </div>

        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title">Timezone</h5>
            <div class="row g-2 align-items-center">
              <div class="col-12 col-sm-6 col-md-4">
                <select
                  id="config-timezone"
                  class="form-select form-select-sm"
                ></select>
              </div>
              <div class="col-12 col-sm-auto">
                <button
                  type="button"
                  id="btn-detect-timezone"
                  class="btn btn-outline-secondary btn-sm w-100 w-sm-auto"
                  title="Detect browser timezone"
                >
                  <i class="bi bi-geo-alt me-1"></i>Browser timezone
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="d-grid d-sm-block text-sm-end mb-4">
          <button id="btn-save-all" class="btn btn-primary">
            <i class="bi bi-floppy me-1"></i>Save Config
          </button>
        </div>

        <div class="row justify-content-center">
          <div class="col-12 col-md-6">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">Change password</h5>
                <div class="input-group mb-3">
                  <span class="input-group-text">
                    <i class="bi bi-key"></i>
                  </span>
                  <input
                    type="password"
                    id="new-password"
                    class="form-control"
                    placeholder="New password"
                  />
                </div>
                <div class="d-grid">
                  <button id="btn-change-password" class="btn btn-warning">
                    Apply <i class="bi bi-arrow-repeat ms-1"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      class="toast-container position-fixed bottom-0 start-0 p-3"
      id="toast-container"
    ></div>

    <template id="tpl-toast">
      <div class="toast align-items-center border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body"></div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>
    </template>

    <template id="tpl-group-card">
      <div class="card mb-3 group-card border-secondary-subtle">
        <div
          class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2 py-2 bg-body-secondary"
        >
          <div
            class="d-flex align-items-center flex-grow-1"
            style="min-width: 180px"
          >
            <i
              class="bi bi-grip-vertical group-drag-handle fs-5 text-muted me-2"
              style="cursor: grab"
            ></i>
            <span class="small text-muted fw-semibold me-2">Group</span>
            <input
              type="text"
              class="form-control form-control-sm group-name-input fw-bold flex-grow-1"
              placeholder="Group name"
              style="max-width: 300px"
            />
          </div>
          <div class="d-flex align-items-center gap-2 ms-auto">
            <button
              type="button"
              class="btn btn-success btn-sm btn-add-check-group text-nowrap"
              title="Add check to this group"
            >
              <i class="bi bi-plus-lg me-1"></i>Add check
            </button>
            <button
              type="button"
              class="btn btn-danger btn-sm btn-remove-group"
              title="Remove group"
            >
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
        <div
          class="card-body p-2 checks-container"
          style="min-height: 48px"
        ></div>
      </div>
    </template>

    <template id="tpl-check-row">
      <div class="check-edit-row card card-body p-2 p-sm-3 mb-2">
        <div class="d-flex flex-column flex-sm-row gap-2">
          <div
            class="d-flex align-items-center justify-content-between d-sm-none"
          >
            <div class="d-flex align-items-center">
              <i
                class="bi bi-grip-vertical drag-handle fs-5 text-muted me-2"
                style="cursor: grab"
              ></i>
              <span class="small text-muted fw-semibold">Check</span>
            </div>
            <button
              type="button"
              class="btn btn-danger btn-sm btn-remove-row"
              title="Remove check"
            >
              <i class="bi bi-trash"></i>
            </button>
          </div>

          <i
            class="bi bi-grip-vertical drag-handle fs-5 text-muted flex-shrink-0 d-none d-sm-block align-self-center"
            style="cursor: grab"
          ></i>

          <div class="row g-2 flex-grow-1 align-items-end">
            <div class="col-12 col-sm-3 col-md-2">
              <label class="form-label small mb-0">Type</label>
              <select class="form-select form-select-sm check-type">
                <option value="http">HTTP</option>
                <option value="ping">PING</option>
                <option value="port">PORT</option>
                <option value="manual">Manual</option>
              </select>
            </div>
            <div class="col-12 col-sm-4 col-md-4">
              <label class="form-label small mb-0">Name</label>
              <input
                type="text"
                class="form-control form-control-sm check-name"
                placeholder="Name"
              />
            </div>
            <div class="col-12 col-sm check-manual-col d-none">
              <label class="form-label small mb-0 d-block">Status</label>
              <div
                class="btn-group btn-group-sm d-flex"
                role="group"
                style="max-width: 180px"
              >
                <button
                  type="button"
                  class="btn btn-sm btn-outline-success btn-status-up w-50"
                >
                  UP
                </button>
                <button
                  type="button"
                  class="btn btn-sm btn-outline-danger btn-status-down w-50"
                >
                  DOWN
                </button>
              </div>
              <input type="hidden" class="check-manual" value="up" />
            </div>
            <div class="col-12 col-sm check-host-col">
              <label class="form-label small mb-0">Host/URL</label>
              <input
                type="text"
                class="form-control form-control-sm check-host"
                placeholder="Host/URL"
              />
            </div>
          </div>

          <button
            type="button"
            class="btn btn-danger btn-sm btn-remove-row flex-shrink-0 d-none d-sm-block align-self-center"
            title="Remove check"
          >
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </template>

    <template id="tpl-outage-row">
      <div class="outage-edit-row card card-body p-2 p-sm-3 mb-2">
        <div
          class="d-flex justify-content-between align-items-center mb-2 d-sm-none"
        >
          <span class="small text-muted fw-semibold">Outage</span>
          <button
            type="button"
            class="btn btn-danger btn-sm btn-remove-row"
            title="Remove outage"
          >
            <i class="bi bi-trash"></i>
          </button>
        </div>
        <div class="row g-2 align-items-end">
          <div class="col-12 col-sm-3">
            <label class="form-label small mb-0">Start</label>
            <input
              type="datetime-local"
              step="1"
              class="form-control form-control-sm outage-date"
            />
          </div>
          <div class="col-12 col-sm-3">
            <label class="form-label small mb-0">End (opt.)</label>
            <input
              type="datetime-local"
              step="1"
              class="form-control form-control-sm outage-end"
            />
          </div>
          <div class="col-12 col-sm">
            <label class="form-label small mb-0">Description</label>
            <textarea
              class="form-control form-control-sm outage-text"
              placeholder="Description"
              rows="1"
            ></textarea>
          </div>
          <div class="col-auto d-none d-sm-block">
            <button
              type="button"
              class="btn btn-danger btn-sm btn-remove-row"
              title="Remove outage"
            >
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/panel.js"></script>
  </body>
</html>
