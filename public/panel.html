<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel - Statuspage</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav id="navbar" class="navbar bg-body-tertiary border-bottom d-none">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">
          <i class="bi bi-arrow-left me-2"></i>Admin Panel
        </a>
        <div>
          <button id="btn-theme" class="btn btn-outline-secondary btn-sm me-2">
            <i class="bi bi-sun"></i>
          </button>
          <button id="btn-logout" class="btn btn-outline-danger btn-sm">
            Logout <i class="bi bi-box-arrow-right ms-1"></i>
          </button>
        </div>
      </div>
    </nav>

    <div class="container py-4" style="max-width: 1200px">
      <!-- Login Section -->
      <div id="login-section" class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card">
            <div class="card-body">
              <h4 class="card-title text-center mb-4" id="login-title">
                Login
              </h4>
              <div class="input-group mb-3">
                <span class="input-group-text">
                  <i class="bi bi-lock"></i>
                </span>
                <input
                  type="password"
                  id="login-password"
                  class="form-control"
                  placeholder="Admin password"
                />
              </div>
              <div class="d-grid" id="login-btn-container">
                <button id="btn-login" class="btn btn-primary">
                  Log in <i class="bi bi-arrow-right ms-1"></i>
                </button>
              </div>
              <div class="d-grid d-none" id="setup-btn-container">
                <button id="btn-setup" class="btn btn-success">
                  Set password <i class="bi bi-check-lg ms-1"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Admin Panel -->
      <div id="admin-panel" class="d-none">
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title">Edit checks</h5>
            <div id="edit-checks-list"></div>
            <button id="btn-add-check" class="btn btn-success btn-sm mt-2">
              <i class="bi bi-plus-lg me-1"></i>Add check
            </button>
          </div>
        </div>

        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title">Edit outages</h5>
            <div id="edit-outages-list"></div>
            <button id="btn-add-outage" class="btn btn-success btn-sm mt-2">
              <i class="bi bi-plus-lg me-1"></i>Add outage
            </button>
          </div>
        </div>

        <div class="text-end mb-4">
          <button id="btn-save-all" class="btn btn-primary">
            <i class="bi bi-floppy me-1"></i>Save Config
          </button>
        </div>

        <div class="row justify-content-center">
          <div class="col-12 col-md-6">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">Change password</h5>
                <div class="input-group mb-3">
                  <span class="input-group-text">
                    <i class="bi bi-key"></i>
                  </span>
                  <input
                    type="password"
                    id="new-password"
                    class="form-control"
                    placeholder="New password"
                  />
                </div>
                <div class="d-grid">
                  <button id="btn-change-password" class="btn btn-warning">
                    Apply <i class="bi bi-arrow-repeat ms-1"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      class="toast-container position-fixed bottom-0 start-0 p-3"
      id="toast-container"
    ></div>

    <template id="tpl-toast">
      <div class="toast align-items-center border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body"></div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>
    </template>

    <template id="tpl-check-row">
      <div class="check-edit-row card card-body py-2 mb-2">
        <div class="d-flex gap-2 align-items-center">
          <i
            class="bi bi-grip-vertical drag-handle fs-5 text-muted flex-shrink-0"
          ></i>
          <div class="row g-2 flex-grow-1">
            <div class="col-6 col-sm-2">
              <label class="form-label small mb-0">Group</label>
              <input
                type="text"
                class="form-control form-control-sm check-group"
                placeholder="Group"
              />
            </div>
            <div class="col-6 col-sm-2">
              <label class="form-label small mb-0">Type</label>
              <select class="form-select form-select-sm check-type">
                <option value="http">HTTP</option>
                <option value="ping">PING</option>
                <option value="port">PORT</option>
                <option value="manual">Manual</option>
              </select>
            </div>
            <div class="col-12 col-sm">
              <label class="form-label small mb-0">Name</label>
              <input
                type="text"
                class="form-control form-control-sm check-name"
                placeholder="Name"
              />
            </div>
            <div class="col-12 col-sm check-manual-col d-none">
              <label class="form-label small mb-0">Status</label>
              <select class="form-select form-select-sm check-manual">
                <option value="up">UP</option>
                <option value="down">DOWN</option>
              </select>
            </div>
            <div class="col-12 col-sm check-host-col">
              <label class="form-label small mb-0">Host/URL</label>
              <input
                type="text"
                class="form-control form-control-sm check-host"
                placeholder="Host/URL"
              />
            </div>
          </div>
          <button class="btn btn-danger btn-sm btn-remove-row flex-shrink-0">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </template>

    <template id="tpl-outage-row">
      <div class="outage-edit-row card card-body mb-2">
        <div class="row g-2 align-items-end">
          <div class="col-sm-3">
            <label class="form-label small mb-0">Start</label>
            <input
              type="datetime-local"
              class="form-control form-control-sm outage-date"
            />
          </div>
          <div class="col-sm-3">
            <label class="form-label small mb-0">End (opt.)</label>
            <input
              type="datetime-local"
              class="form-control form-control-sm outage-end"
            />
          </div>
          <div class="col-sm">
            <label class="form-label small mb-0">Description</label>
            <textarea
              class="form-control form-control-sm outage-text"
              placeholder="Description"
              rows="1"
            ></textarea>
          </div>
          <div class="col-auto">
            <button class="btn btn-danger btn-sm btn-remove-row">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="js/panel.js"></script>
  </body>
</html>
